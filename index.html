<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#6366f1" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <title>Laporan Kegiatan Harian</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header position-relative z-3 animate__animated animate__fadeInDown" data-aos="fade-down">
    <div class="container header-inner">
      <div class="brand d-flex align-items-center gap-2">
        <span class="brand-icon">📋</span>
        <span class="fw-bold fs-5">Laporan Harian</span>
      </div>
      <div class="header-actions d-flex align-items-center gap-2 no-print">
        <button class="btn btn-ghost btn-sm" id="exportBtn" title="Export Data">Export</button>
        <button class="btn btn-ghost btn-sm" id="themeToggle" title="Ganti Tema">
          <span id="themeIcon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <main class="container py-4 position-relative z-3">
    <!-- Identity Section -->
    <section class="card mb-4 border-0 shadow-sm no-print" data-aos="fade-up" data-aos-duration="800">
      <div class="card-body p-3">
        <details>
          <summary class="fw-semibold" style="cursor:pointer">Identitas Pelapor (untuk hasil cetak)</summary>
          <div class="row g-2 mt-2">
            <div class="col-md-4">
              <label for="profileNama" class="form-label fw-semibold small mb-1">Nama</label>
              <input type="text" class="form-control form-control-sm" id="profileNama" placeholder="Nama lengkap" />
            </div>
            <div class="col-md-4">
              <label for="profilePosisi" class="form-label fw-semibold small mb-1">Posisi</label>
              <input type="text" class="form-control form-control-sm" id="profilePosisi" placeholder="Contoh: Tenaga Pendukung Database" />
            </div>
            <div class="col-md-4">
              <label for="profileInstansi" class="form-label fw-semibold small mb-1">Instansi</label>
              <input type="text" class="form-control form-control-sm" id="profileInstansi" placeholder="Nama instansi" />
            </div>
          </div>
          <button class="btn btn-ghost btn-sm mt-2" id="saveProfile">Simpan Identitas</button>
        </details>
      </div>
    </section>

    <!-- Form Section -->
    <section class="card animate__animated animate__fadeIn mb-4 border-0 shadow-sm no-print" data-aos="fade-up" data-aos-duration="800">
      <div class="card-body p-4">
        <div class="card-header d-flex justify-content-between align-items-center mb-3 border-0 bg-transparent">
          <h2 class="h5 mb-0 fw-bold">Tambah Laporan</h2>
          <button class="btn btn-link text-decoration-none text-muted" id="toggleForm">Batal</button>
        </div>
        <form id="reportForm" class="row g-3">
          <input type="hidden" id="editId" />
          <div class="col-md-3 form-group">
            <label for="date" class="form-label fw-semibold">Tanggal</label>
            <input type="date" class="form-control form-control-sm" id="date" required />
          </div>
          <div class="col-md-4 form-group">
            <label for="activity" class="form-label fw-semibold">Kegiatan</label>
            <input type="text" class="form-control form-control-sm" id="activity" placeholder="Contoh: Rapat tim" required />
          </div>
          <div class="col-md-3 form-group">
            <label for="photo" class="form-label fw-semibold">Dokumentasi (foto)</label>
            <input type="file" class="form-control form-control-sm" id="photo" accept="image/*" />
          </div>
          <div class="col-md-1 d-flex align-items-end">
            <img id="photoPreview" src="" alt="Preview" class="rounded-2 border" style="width:60px;height:60px;object-fit:cover;" />
          </div>
          <div class="col-md-2 form-group">
            <label for="status" class="form-label fw-semibold">Status</label>
            <select class="form-select form-control-sm" id="status">
              <option value="Selesai">Selesai</option>
              <option value="Proses">Proses</option>
              <option value="Tertunda">Tertunda</option>
            </select>
          </div>
          <div class="col-12 form-actions d-flex gap-2">
            <button type="submit" class="btn btn-indigo flex-fill" id="submitBtn">Simpan</button>
            <button type="button" class="btn btn-outline" id="cancelEdit">Batal Edit</button>
          </div>
        </form>
      </div>
    </section>

    <!-- List Section -->
    <section class="card animate__animated animate__fadeIn border-0 shadow-sm" data-aos="fade-up" data-aos-duration="800">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-3">
          <div>
            <h2 class="h5 mb-0 fw-bold">Daftar Laporan</h2>
          </div>
          <div class="toolbar d-flex gap-2 flex-wrap no-print">
            <input type="text" class="form-control form-control-sm" id="searchInput" placeholder="Cari kegiatan..." />
            <select class="form-select form-control-sm" id="filterStatus">
              <option value="">Semua Status</option>
              <option value="Selesai">Selesai</option>
              <option value="Proses">Proses</option>
              <option value="Tertunda">Tertunda</option>
            </select>
            <input type="date" class="form-control form-control-sm" id="filterDate" />
            <input type="month" class="form-control form-control-sm" id="filterMonth" />
            <button class="btn btn-ghost btn-sm" id="printBtn" title="Cetak Laporan">Cetak</button>
          </div>
        </div>
        <div class="table-wrap rounded-3 border overflow-hidden" id="reportList">
          <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
              <tr>
                <th class="fw-semibold text-muted small">Tanggal</th>
                <th class="fw-semibold text-muted small">Kegiatan</th>
                <th class="fw-semibold text-muted small">Dokumentasi</th>
                <th class="fw-semibold text-muted small">Status</th>
                <th class="fw-semibold text-muted small text-end">Aksi</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
        <div id="emptyState" class="empty-state text-center py-5 border rounded-3" style="display:none">
          <p class="text-muted fw-medium">Tidak ada laporan yang cocok.</p>
        </div>
      </div>
    </section>
    <!-- Print Preview Section -->
    <section class="card mt-4 border-0 shadow-sm no-print" data-aos="fade-up" data-aos-duration="800">
      <div class="card-body p-4">
        <h2 class="h5 mb-3 fw-bold">Preview Lembar Kegiatan</h2>
        <div class="print-paper">
          <div id="printPreview"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer mt-5 animate__animated animate__fadeInUp" data-aos="fade-up">
    <div class="container py-4 border-top">
      <p class="mb-0 text-muted small">&copy; 2026 Laporan Kegiatan Harian. Open source &mdash;
        <a href="https://github.com/ilhamakbardonny/laporan-kegiatan-harian" target="_blank" rel="noopener" class="text-indigo text-decoration-none">GitHub</a>
      </p>
    </div>
  </footer>

  <div class="saved-badge"></div>
  <div id="printArea"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="script.js"></script>
</body>
</html>
